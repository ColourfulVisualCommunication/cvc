# Short-term: pings the Render API so the free instance doesn't spin down
# after 15 minutes idle. Backup to the UptimeRobot monitor, not a replacement —
# GitHub runs scheduled workflows best-effort, so runs can arrive late or be skipped.
# Delete this file once the backend moves to a paid Render plan.
#
# Minutes: each run bills as at least 1 minute. Every 10 min ≈ 4,320 runs/month —
# free on a public repo, but over the 2,000-minute private-repo allowance.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *" # UTC; GitHub's minimum is every 5 minutes
  workflow_dispatch: # lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        # --max-time 90 gives a sleeping instance time to cold-start;
        # --retry covers a 502 while Render is still booting it.
        run: |
          curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
               https://cvc-api.onrender.com/api/v1/health
